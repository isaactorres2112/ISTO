<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulso de Bienestar</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#111;--text:#f4f1e9;--muted:#aaa69e;--gold:#c6a367;--line:#3b3327}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}.widget{width:100%;padding:10px}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px}.placeholder{min-height:180px;display:grid;place-items:center;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--line)}.metric{padding:18px 12px;background:#0d0d0d;text-align:center}.metric-label{display:block;min-height:30px;color:var(--muted);font-size:10px;line-height:1.4;letter-spacing:1.3px;text-transform:uppercase}.metric-value{display:block;margin-top:8px;color:var(--gold);font-size:clamp(29px,6vw,43px);font-weight:600;line-height:1}.metric-update{display:block;margin-top:7px;color:var(--muted);font-size:8px;font-weight:400}.circles{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:12px;margin-top:18px;overflow-x:auto;padding:4px 2px 10px}.circle{text-align:center;min-width:100px}.ring{--pct:0;width:70px;height:70px;margin:0 auto 9px;padding:3px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--pct)*1%),#29251f 0)}.inner{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:#080808;border:1px solid #24211c;color:#fff;font-size:22px}.name{display:block;font-size:11px}.pct{display:block;margin-top:3px;color:var(--gold);font-size:12px}.highlight{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#0b0b0b}.highlight-label{display:block;margin-bottom:8px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase}.highlight p{margin:0;font-size:14px;line-height:1.55}.highlight strong{color:var(--gold);font-weight:600}@media(max-width:560px){.widget{padding:6px}.panel{padding:12px}.metric{padding:15px 5px}.metric-label{font-size:8px}.metric-value{font-size:27px}.circles{gap:8px}.ring{width:62px;height:62px}.highlight p{font-size:13px}}@media(min-width:900px){.widget{max-width:1180px;margin:auto}}
</style></head><body><main class="widget"><section class="panel" aria-label="Pulso general de bienestar"><div class="placeholder" id="status">Conectando con los datos de bienestar…</div><div id="content" hidden>
<div class="metrics"><div class="metric"><span class="metric-label">Bienestar general</span><strong class="metric-value" id="general">—</strong></div><div class="metric"><span class="metric-label">Círculos ≥ 70%</span><strong class="metric-value" id="target">—</strong></div><div class="metric"><span class="metric-label">Meses evaluados</span><strong class="metric-value" id="months">—</strong><small class="metric-update" id="updated">—</small></div></div>
<div class="circles" id="circles"></div><div class="highlight"><span class="highlight-label">Lo más destacado</span><p id="highlight">—</p></div></div></section></main>
<script>
'use strict';const el=id=>document.getElementById(id),fmt=v=>Number.isFinite(v)?v.toLocaleString('es-MX',{maximumFractionDigits:1}):'—';
fetch('data-seguimiento-bienestar.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{
 if(!Array.isArray(data.items)||!Array.isArray(data.circulos)||!data.items.length)throw Error('Sin datos');
 const circleAvg={};data.circulos.forEach(c=>{const vals=data.items.map(r=>Number(r.circulos?.[c])).filter(Number.isFinite);circleAvg[c]=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null});
 const generalVals=data.items.map(r=>Number(r.general)).filter(Number.isFinite),general=generalVals.length?generalVals.reduce((s,v)=>s+v,0)/generalVals.length:null;
 const valid=Object.values(circleAvg).filter(Number.isFinite),onTarget=valid.filter(v=>v>=70).length;
 el('general').textContent=Number.isFinite(general)?fmt(general)+'%':'—';el('target').textContent=onTarget+'/'+valid.length;el('months').textContent=data.items.length;
 const stamp=data.ultima_actualizacion?new Date(data.ultima_actualizacion):null;el('updated').textContent='Actualizado '+(stamp?stamp.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'—');
 const icons={Yo:'○',Pareja:'♡',Familia:'◇',Trabajo:'▦',Amistad:'✦'},ranked=data.circulos.map(c=>({name:c,pct:circleAvg[c]})).filter(x=>Number.isFinite(x.pct)).sort((a,b)=>a.pct-b.pct);
 ranked.forEach(x=>{const d=document.createElement('div');d.className='circle';d.innerHTML='<div class="ring" style="--pct:'+Math.min(100,x.pct)+'"><div class="inner">'+(icons[x.name]||'•')+'</div></div><span class="name">'+x.name+'</span><strong class="pct">'+fmt(x.pct)+'%</strong>';el('circles').append(d)});
 const low=ranked[0],high=ranked.at(-1),parts=[];if(high)parts.push('<strong>'+high.name+'</strong> es el círculo con mayor bienestar general.');if(low&&low!==high)parts.push('<strong>'+low.name+'</strong> es actualmente el área con menor nivel de bienestar.');
 if(data.items.length>=2){const a=data.items.at(-2),b=data.items.at(-1),changes=data.circulos.map(c=>({name:c,d:(Number(b.circulos?.[c])-Number(a.circulos?.[c]))})).filter(x=>Number.isFinite(x.d)).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));const t=changes[0];if(t&&Math.abs(t.d)>=5)parts.push('<strong>'+t.name+'</strong> muestra el cambio reciente más marcado '+(t.d>0?'al alza.':'a la baja.'))}
 el('highlight').innerHTML=parts.join(' ')||'Aún no hay suficientes datos para identificar tendencias relevantes.';el('status').hidden=true;el('content').hidden=false;
}).catch(()=>el('status').textContent='No se pudieron cargar los datos de bienestar.');
</script></body></html>
