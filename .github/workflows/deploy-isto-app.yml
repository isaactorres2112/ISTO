name: Deploy ISTO to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "NOTION/**"
      - "finanzas-2026/**"
      - ".github/workflows/deploy-isto-app.yml"
      - ".github/workflows/sync-seguimiento-bienestar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio completo
        run: |
          test -f app/index.html
          test -f app/styles.css
          test -f app/app.js
          mkdir -p _site
          cp -R app/. _site/
          cp -R NOTION _site/NOTION
          cp -R finanzas-2026 _site/finanzas-2026
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
