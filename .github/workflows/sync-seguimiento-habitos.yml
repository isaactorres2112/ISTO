name: Sincronizar seguimiento de hábitos desde Notion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-seguimiento-habitos.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Leer Notion y generar data-seguimiento-habitos.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: 3b401ec1-e57b-80a1-a29e-000b303d2775
          TZ: America/Mexico_City
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import defaultdict
          from datetime import datetime, date, timedelta

          habits = ['Dormir','Salud','Ejercicio','Orar','Ahorrar','Leer','Agua','Uñas','Tocarse','Animo']
          def query_data_source(source_id):
              url = f"https://api.notion.com/v1/data_sources/{source_id}/query"
              results, cursor = [], None
              while True:
                  body = {} if not cursor else {'start_cursor': cursor}
                  req = urllib.request.Request(url, data=json.dumps(body).encode(), method='POST', headers={
                      'Authorization': f"Bearer {os.environ['NOTION_TOKEN']}",
                      'Notion-Version': '2026-03-11',
                      'Content-Type': 'application/json'
                  })
                  with urllib.request.urlopen(req) as r:
                      payload = json.load(r)
                  results.extend(payload['results'])
                  if not payload.get('has_more'):
                      return results
                  cursor = payload.get('next_cursor')
                  if not cursor:
                      raise ValueError('Notion no devolvió el cursor de la siguiente página')

          # Metas semanales vigentes. Al cierre de cada mes se pueden revisar
          # y registrar cambios con fecha de entrada en vigor, sin alterar meses anteriores.
          goal_changes = {
              '0001-01': dict(zip(habits, [7, 7, 3, 4, 1, 5, 5, 7, 6, 7])),
          }

          def goals_for_month(key):
              goals = {}
              for effective_month in sorted(goal_changes):
                  if effective_month <= key:
                      goals.update(goal_changes[effective_month])
              missing = [h for h in habits if h not in goals]
              if missing:
                  raise ValueError('Faltan metas para: ' + ', '.join(missing))
              for h, goal in goals.items():
                  if not isinstance(goal, int) or not 1 <= goal <= 7:
                      raise ValueError(f'Meta semanal inválida para {h}: {goal}')
              return goals

          results = query_data_source(os.environ['DATA_SOURCE_ID'])

          today = date.today()
          monthly = defaultdict(lambda: {h:{'done':0,'days':0,'weeks':set()} for h in habits})
          seen_dates = set()
          last_evaluated_date = None
          for page in results:
              p = page.get('properties', {})
              raw_date = (p.get('Fecha', {}).get('date') or {}).get('start')
              if not raw_date: continue
              try: dt = datetime.fromisoformat(raw_date[:10]).date()
              except: continue
              if dt >= today: continue
              if dt in seen_dates:
                  raise ValueError(f'Fecha duplicada en seguimiento: {dt}')
              seen_dates.add(dt)
              if last_evaluated_date is None or dt > last_evaluated_date:
                  last_evaluated_date = dt
              key = dt.strftime('%Y-%m')
              week_start = dt - timedelta(days=dt.weekday())
              for h in habits:
                  monthly[key][h]['days'] += 1
                  monthly[key][h]['weeks'].add(week_start.isoformat())
                  if p.get(h, {}).get('checkbox') is True:
                      monthly[key][h]['done'] += 1

          months_es=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
          items=[]
          for key in sorted(monthly):
              goals = goals_for_month(key)
              y,m=map(int,key.split('-'))
              row={'key':key,'mes':months_es[m-1],'anio':y,'habitos':{},'detalle':{}}
              for h,v in monthly[key].items():
                  # Cada semana cuenta desde el lunes con su meta semanal completa.
                  # Si un mes toca una semana parcial, esa semana sigue contando una sola vez.
                  expected = len(v['weeks']) * goals[h]
                  row['habitos'][h] = round(min(100, v['done'] * 100 / expected), 1) if expected else None
                  row['detalle'][h] = {'realizadas': v['done'], 'esperadas': round(expected, 4),
                                       'dias_evaluados': v['days'], 'semanas_evaluadas': len(v['weeks']), 'meta_semanal': goals[h]}
              items.append(row)

          with open('data-seguimiento-habitos.json','w',encoding='utf-8') as f:
              json.dump({'habitos':habits,'metas_semanales':goals_for_month(today.strftime('%Y-%m')),
                         'ultima_actualizacion': datetime.now().astimezone().isoformat(timespec='seconds'),
                         'ultimo_dia_evaluado': last_evaluated_date.isoformat() if last_evaluated_date else None,
                         'items':items},f,ensure_ascii=False,indent=2)
          PY

      - name: Guardar cambios
        run: |
          git add data-seguimiento-habitos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar seguimiento mensual de hábitos"
          git pull --rebase origin main
          git push origin HEAD:main
