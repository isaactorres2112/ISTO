name: Sincronizar seguimiento de hábitos desde Notion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-seguimiento-habitos.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: isto-notion-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Leer Notion y generar data-seguimiento-habitos.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: 3b401ec1-e57b-80a1-a29e-000b303d2775
          TZ: America/Mexico_City
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import defaultdict
          from datetime import datetime, date, timedelta

          habits = ['Dormir','Salud','Ejercicio','Orar','Ahorrar','Leer','Agua','Uñas','Tocarse','Animo']
          weekly_goals = dict(zip(habits,[7,7,3,4,1,5,5,7,6,7]))

          def query_data_source(source_id):
              url=f"https://api.notion.com/v1/data_sources/{source_id}/query"
              results,cursor=[],None
              while True:
                  body={} if not cursor else {'start_cursor':cursor}
                  req=urllib.request.Request(url,data=json.dumps(body).encode(),method='POST',headers={
                      'Authorization':f"Bearer {os.environ['NOTION_TOKEN']}",
                      'Notion-Version':'2026-03-11','Content-Type':'application/json'})
                  with urllib.request.urlopen(req) as r: payload=json.load(r)
                  results.extend(payload['results'])
                  if not payload.get('has_more'): return results
                  cursor=payload.get('next_cursor')
                  if not cursor: raise ValueError('Notion no devolvió cursor')

          results=query_data_source(os.environ['DATA_SOURCE_ID'])
          today=date.today()
          daily=[]
          seen=set()

          for page in results:
              p=page.get('properties',{})
              raw=(p.get('Fecha',{}).get('date') or {}).get('start')
              if not raw: continue
              try: dt=datetime.fromisoformat(raw[:10]).date()
              except: continue
              if dt>today: continue
              if dt in seen: raise ValueError(f'Fecha duplicada en seguimiento: {dt}')
              seen.add(dt)
              state={h:bool(p.get(h,{}).get('checkbox')) for h in habits}
              daily.append({'fecha':dt.isoformat(),'habitos':state,'cumplidos':sum(state.values()),'total':len(habits)})

          daily.sort(key=lambda x:x['fecha'])
          # Cumplimiento global normalizado por la frecuencia semanal de cada hábito.
          # Para semanas parciales, nunca se exigen más sesiones que días registrados.
          weeks=defaultdict(list)
          for x in daily:
              dt=datetime.fromisoformat(x['fecha']).date()
              week=(dt-timedelta(days=dt.weekday())).isoformat()
              weeks[week].append(x)

          habit_done={h:sum(1 for x in daily if x['habitos'][h]) for h in habits}
          habit_expected={}
          habit_global={}
          for h in habits:
              expected=sum(min(weekly_goals[h],len(rows)) for rows in weeks.values())
              habit_expected[h]=expected
              habit_global[h]=round(min(100,habit_done[h]*100/expected),1) if expected else 0

          # El general es el promedio de los 10 hábitos ya normalizados por su propia meta.
          general=round(sum(habit_global.values())/len(habits),1) if habits else 0
          total_checks=sum(habit_done.values())
          total_possible=sum(habit_expected.values())

          # Tendencia: semana actual contra la semana anterior, usando los días registrados de cada una.
          monday=today-timedelta(days=today.weekday())
          prev_monday=monday-timedelta(days=7)
          current=[x for x in daily if monday.isoformat()<=x['fecha']<=today.isoformat()]
          previous=[x for x in daily if prev_monday.isoformat()<=x['fecha']<(monday.isoformat())]
          trend={}
          for h in habits:
              cur=round(sum(x['habitos'][h] for x in current)*100/len(current),1) if current else None
              prev=round(sum(x['habitos'][h] for x in previous)*100/len(previous),1) if previous else None
              trend[h]={'actual':cur,'anterior':prev,'cambio':round(cur-prev,1) if cur is not None and prev is not None else None}

          # Se conservan items mensuales por compatibilidad con la app mientras se unifica su interfaz.
          monthly=defaultdict(lambda:{h:{'done':0,'days':0,'weeks':set()} for h in habits})
          for x in daily:
              dt=datetime.fromisoformat(x['fecha']).date()
              if dt==today: continue
              key=dt.strftime('%Y-%m'); week=dt-timedelta(days=dt.weekday())
              for h in habits:
                  monthly[key][h]['days']+=1; monthly[key][h]['weeks'].add(week.isoformat())
                  if x['habitos'][h]: monthly[key][h]['done']+=1
          months_es=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
          items=[]
          for key in sorted(monthly):
              y,m=map(int,key.split('-')); row={'key':key,'mes':months_es[m-1],'anio':y,'habitos':{},'detalle':{}}
              for h,v in monthly[key].items():
                  expected=len(v['weeks'])*weekly_goals[h]
                  row['habitos'][h]=round(min(100,v['done']*100/expected),1) if expected else None
                  row['detalle'][h]={'realizadas':v['done'],'esperadas':expected,'dias_evaluados':v['days'],'semanas_evaluadas':len(v['weeks']),'meta_semanal':weekly_goals[h]}
              items.append(row)

          today_row=next((x for x in daily if x['fecha']==today.isoformat()),None)
          output={
              'habitos':habits,'metas_semanales':weekly_goals,
              'ultima_actualizacion':datetime.now().astimezone().replace(second=0,microsecond=0).isoformat(timespec='seconds'),
              'ultimo_dia_evaluado':daily[-1]['fecha'] if daily else None,
              'hoy':{'fecha':today.isoformat(),'cumplidos':today_row['cumplidos'] if today_row else 0,'total':len(habits),'porcentaje':round((today_row['cumplidos'] if today_row else 0)*100/len(habits)),'habitos':today_row['habitos'] if today_row else {h:False for h in habits}},
              'global':{'cumplimiento':general,'cumplidos':total_checks,'posibles':total_possible,'dias_registrados':len(daily),'habitos':habit_global,'detalle':{h:{'realizadas':habit_done[h],'esperadas':habit_expected[h],'meta_semanal':weekly_goals[h]} for h in habits}},
              'tendencia_semanal':trend,'diarios':daily,'items':items
          }
          with open('NOTION/data-seguimiento-habitos.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          PY

      - name: Guardar cambios
        run: |
          git add NOTION/data-seguimiento-habitos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar seguimiento global de hábitos"
          git pull --rebase origin main
          git push origin HEAD:main || (sleep 3 && git pull --rebase origin main && git push origin HEAD:main)
# Actualización manual: 2026-10-02 01:40
