<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>:root{--ink:#172033;--muted:#738095;--line:#e8edf3;--panel:#fff;--bg:#f6f8fb;--accent:#315efb;--goal:#8b95a7;--good:#14804a;--bad:#c13c3c}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.card{width:100%;min-height:410px;padding:22px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 8px 28px rgba(18,32,56,.06)}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}h1{font-size:20px;line-height:1.2;margin:5px 0 16px}.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.kpi{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:120px}.kpi b{display:block;font-size:18px}.kpi span{font-size:11px;color:var(--muted)}.positive{color:var(--good)}.negative{color:var(--bad)}.wrap{height:270px;position:relative}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}select{min-width:170px;border:1px solid #d9e0e9;border-radius:9px;padding:8px 11px;background:#fff;color:var(--ink);font-weight:600}.note{font-size:11px;color:var(--muted)}@media(max-width:520px){.card{padding:16px}.wrap{height:250px}}</style></head><body><section class="card"><h1>Cumplimiento de hábitos mensual</h1><div class="kpis"><div class="kpi"><b id="actual">—</b><span>Mes actual</span></div><div class="kpi"><b>70%</b><span>Meta</span></div><div class="kpi"><b id="gap">—</b><span>Diferencia vs. meta</span></div></div><div class="wrap"><canvas id="chart"></canvas></div><div class="note">El día en curso no se incluye en el cálculo.</div></section><script>
const META=70;
fetch('data-seguimiento-habitos.json?'+Date.now()).then(r=>r.json()).then(d=>{
 if(d.metas_semanales) document.querySelectorAll('.note')[0].textContent='Cumplimiento según metas semanales, prorrateadas por los días registrados. Máximo 100% por hábito. El día en curso no se incluye.';
 const rows=d.items, labels=rows.map(x=>x.mes.slice(0,3)+' '+x.anio);
 const values=rows.map(x=>{const a=Object.values(x.habitos).filter(Number.isFinite);return a.length?+(a.reduce((s,v)=>s+v,0)/a.length).toFixed(1):null});
 const last=[...values].reverse().find(Number.isFinite);
 if(last!=null){actual.textContent=last.toFixed(1)+'%';const delta=+(last-META).toFixed(1);gap.textContent=(delta>0?'+':'')+delta.toFixed(1)+' pp';gap.className=delta>=0?'positive':'negative'}
 new Chart(chart,{type:'line',data:{labels,datasets:[{label:'Cumplimiento',data:values,borderColor:'#315efb',backgroundColor:'rgba(49,94,251,.08)',borderWidth:3,pointBackgroundColor:'#315efb',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:4,pointHoverRadius:6,tension:.28,fill:true},{label:'Meta 70%',data:labels.map(()=>META),borderColor:'#8b95a7',borderWidth:1.5,borderDash:[7,6],pointRadius:0,fill:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'end',labels:{usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+c.parsed.y+'%'}}},scales:{y:{min:0,max:100,ticks:{stepSize:20,callback:v=>v+'%',color:'#738095'},grid:{color:'#edf1f5'}},x:{ticks:{color:'#738095'},grid:{display:false}}}}});
}).catch(()=>document.querySelector('.note').textContent='No se pudieron cargar los datos.');</script></body></html>
