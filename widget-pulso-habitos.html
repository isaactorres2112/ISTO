<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulso de Hábitos</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --panel: #111111;
      --text: #f4f1e9;
      --muted: #aaa69e;
      --gold: #c6a367;
      --line: #3b3327;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .widget {
      width: 100%;
      padding: 24px;
    }

    .panel {
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 24px;
    }

    .placeholder {
      min-height: 190px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="widget">
    <section class="panel" aria-label="Pulso general de hábitos">
      <div class="placeholder" id="status" role="status" aria-live="polite">
        Conectando con los datos de hábitos…
      </div>
    </section>
  </main>
  <script>
    'use strict';

    const status = document.getElementById('status');
    let habitData = null;

    async function loadHabitData() {
      try {
        const response = await fetch('data-seguimiento-habitos.json?t=' + Date.now(), {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.habitos) || !Array.isArray(data.items)) {
          throw new Error('Formato de datos inválido');
        }

        habitData = data;
        status.textContent =
          'Datos conectados correctamente · ' +
          data.habitos.length +
          ' hábitos disponibles';

        console.info('Pulso de Hábitos: datos cargados', habitData);
      } catch (error) {
        status.textContent = 'No se pudieron cargar los datos de hábitos.';
        console.error('Pulso de Hábitos:', error);
      }
    }

    loadHabitData();
  </script>
</body>
</html>
