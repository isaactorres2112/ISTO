<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>:root{--ink:#172033;--muted:#738095;--line:#e8edf3;--panel:#fff;--bg:#f6f8fb;--accent:#315efb;--goal:#8b95a7;--good:#14804a;--bad:#c13c3c}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.card{width:100%;min-height:410px;padding:22px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 8px 28px rgba(18,32,56,.06)}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}h1{font-size:20px;line-height:1.2;margin:5px 0 16px}.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.kpi{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:120px}.kpi b{display:block;font-size:18px}.kpi span{font-size:11px;color:var(--muted)}.positive{color:var(--good)}.negative{color:var(--bad)}.wrap{height:270px;position:relative}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}select{min-width:170px;border:1px solid #d9e0e9;border-radius:9px;padding:8px 11px;background:#fff;color:var(--ink);font-weight:600}.note{font-size:11px;color:var(--muted)}@media(max-width:520px){.card{padding:16px}.wrap{height:250px}}</style></head><body><section class="card"><h1>Cumplimiento mensual por hábito</h1><div class="toolbar"><select id="habit"></select><div class="note">Meta · 70%</div></div><div class="wrap"><canvas id="chart"></canvas></div><div class="note">Hábitos ordenados de menor a mayor según su último resultado disponible. Metas semanales prorrateadas por los días registrados; máximo 100%. El día en curso no se incluye.</div></section><script>
const META=70;
fetch('data-seguimiento-habitos.json?'+Date.now()).then(r=>r.json()).then(d=>{
 const lastValue=h=>{for(let i=d.items.length-1;i>=0;i--){const v=d.items[i].habitos[h];if(Number.isFinite(v))return v}return Infinity};
 const habits=[...d.habitos].sort((a,b)=>lastValue(a)-lastValue(b)||a.localeCompare(b,'es'));
 const sel=document.getElementById('habit');habits.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h+' · '+(Number.isFinite(lastValue(h))?lastValue(h).toFixed(1)+'%':'—');sel.appendChild(o)});
 const labels=d.items.map(x=>x.mes.slice(0,3)+' '+x.anio);let c;
 function draw(h){if(c)c.destroy();c=new Chart(chart,{type:'line',data:{labels,datasets:[{label:h,data:d.items.map(x=>x.habitos[h]),borderColor:'#315efb',backgroundColor:'rgba(49,94,251,.08)',borderWidth:3,pointBackgroundColor:'#315efb',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:4,pointHoverRadius:6,tension:.28,fill:true},{label:'Meta 70%',data:labels.map(()=>META),borderColor:'#8b95a7',borderWidth:1.5,borderDash:[7,6],pointRadius:0,fill:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'end',labels:{usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:x=>' '+x.dataset.label+': '+x.parsed.y+'%'}}},scales:{y:{min:0,max:100,ticks:{stepSize:20,callback:v=>v+'%',color:'#738095'},grid:{color:'#edf1f5'}},x:{ticks:{color:'#738095'},grid:{display:false}}}}})}
 sel.onchange=()=>draw(sel.value);if(habits.length)draw(habits[0]);
}).catch(()=>document.querySelectorAll('.note')[1].textContent='No se pudieron cargar los datos.');</script></body></html>
