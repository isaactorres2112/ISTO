<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISTO · Fecha y cuenta regresiva</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #37352f;
      --muted: #787774;
      --line: rgba(55,53,47,.12);
      --bg: transparent;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f1f1ef;
        --muted: #a9a9a6;
        --line: rgba(255,255,255,.12);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); }
    body {
      min-height: 220px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    .widget {
      width: min(100%, 900px);
      padding: 24px 28px;
      text-align: center;
    }
    .weekday {
      margin: 0 0 7px;
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 650;
      letter-spacing: .22em;
      color: var(--muted);
    }
    .date {
      margin: 0;
      font-size: clamp(22px, 4.8vw, 40px);
      line-height: 1.05;
      font-weight: 720;
      letter-spacing: -0.045em;
    }
    .year {
      display: inline-block;
      margin-top: 12px;
      padding-top: 10px;
      min-width: 72px;
      border-top: 1px solid var(--line);
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 550;
      letter-spacing: .16em;
      color: var(--muted);
    }
    .countdown {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .countdown-number {
      margin: 0;
      font-size: clamp(24px, 5vw, 42px);
      line-height: 1;
      font-weight: 720;
      letter-spacing: -0.035em;
    }
    .countdown-label {
      margin: 7px 0 0;
      font-size: clamp(10px, 1.8vw, 13px);
      font-weight: 600;
      letter-spacing: .16em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stoic {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .quote {
      margin: 0 auto;
      max-width: 680px;
      font-size: clamp(18px, 2.8vw, 22px);
      line-height: 1.55;
      font-style: italic;
    }
    .author {
      margin: 7px 0 0;
      font-size: clamp(10px, 1.6vw, 12px);
      font-weight: 650;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="Fecha de hoy y cuenta regresiva">
    <p class="weekday" id="weekday"></p>
    <h1 class="date" id="date"></h1>
    <span class="year" id="year"></span>

    <section class="countdown" aria-label="Días restantes al 2 de febrero de 2027">
      <p class="countdown-number" id="daysLeft"></p>
      <p class="countdown-label" id="countdownLabel">días para el 2 de febrero de 2027</p>
    </section>

    <section class="stoic" aria-label="Frase estoica del día">
      <p class="quote" id="quote"></p>
      <p class="author" id="author"></p>
    </section>
  </main>

  <script>
    const weekday = document.getElementById('weekday');
    const date = document.getElementById('date');
    const year = document.getElementById('year');
    const daysLeft = document.getElementById('daysLeft');
    const countdownLabel = document.getElementById('countdownLabel');
    const quote = document.getElementById('quote');
    const author = document.getElementById('author');

    const stoicQuotes = [
      ['La felicidad de tu vida depende de la calidad de tus pensamientos.', 'Marco Aurelio'],
      ['Ningún hombre es libre si no es dueño de sí mismo.', 'Epicteto'],
      ['Sufrimos más a menudo en la imaginación que en la realidad.', 'Séneca'],
      ['No busques que los acontecimientos sucedan como quieres; quiere que sucedan como suceden.', 'Epicteto'],
      ['La mejor venganza es no ser como quien causó el daño.', 'Marco Aurelio'],
      ['Mientras vivas, sigue aprendiendo a vivir.', 'Séneca'],
      ['Tienes poder sobre tu mente, no sobre los acontecimientos externos.', 'Marco Aurelio']
    ];

    function renderWidget() {
      const now = new Date();
      const dayName = new Intl.DateTimeFormat('es-MX', { weekday: 'long' }).format(now);
      const day = new Intl.DateTimeFormat('es-MX', { day: 'numeric' }).format(now);
      const month = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(now);

      weekday.textContent = dayName.toLocaleUpperCase('es-MX');
      date.textContent = `${day} DE ${month.toLocaleUpperCase('es-MX')}`;
      year.textContent = String(now.getFullYear());

      const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const targetUTC = Date.UTC(2027, 1, 2);
      const remaining = Math.max(0, Math.ceil((targetUTC - todayUTC) / 86400000));

      daysLeft.textContent = remaining;
      countdownLabel.textContent = remaining === 1
        ? 'día para el 2 de febrero de 2027'
        : 'días para el 2 de febrero de 2027';

      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - startOfYear) / 86400000);
      const dailyQuote = stoicQuotes[dayOfYear % stoicQuotes.length];
      quote.textContent = `“${dailyQuote[0]}”`;
      author.textContent = `— ${dailyQuote[1]}`;

      document.title = `${dayName} ${day} de ${month} · ${remaining} días restantes`;
    }

    renderWidget();
    setInterval(renderWidget, 60 * 1000);
  </script>
</body>
</html>
