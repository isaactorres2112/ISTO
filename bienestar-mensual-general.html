<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seguimiento de ánimo</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#111;--panel2:#0c0c0c;--text:#f4f1e9;--muted:#aaa69e;--gold:#c6a367;--line:#3b3327}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
.dashboard{width:100%;max-width:1180px;margin:auto;padding:10px}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:18px;font-weight:600}
select{background:#090909;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line)}
.metric{background:#0d0d0d;padding:18px 12px;text-align:center}
.label{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;min-height:28px}
.value{display:block;color:var(--gold);font-size:34px;line-height:1;font-weight:600;margin-top:7px}
.chart-card{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.chart-title{font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px}
.chart{height:230px;width:100%}
.chart svg{width:100%;height:100%;overflow:visible}
.axis{fill:var(--muted);font-size:9px}.grid{stroke:#29251f;stroke-width:1}.goal{stroke:#6c5a3b;stroke-width:1;stroke-dasharray:5 5}.line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#090909;stroke:var(--gold);stroke-width:3}
.note{margin:12px 2px 0;color:var(--muted);font-size:10px;line-height:1.45}
.status{min-height:260px;display:grid;place-items:center;color:var(--muted)}
@media(max-width:560px){.dashboard{padding:6px}.panel{padding:12px}.top{align-items:flex-start}h1{font-size:16px}.metric{padding:14px 5px}.label{font-size:8px}.value{font-size:27px}.chart-card{padding:12px}.chart{height:210px}}
</style>
</head>
<body>
<main class="dashboard">
<section class="panel">
<div id="status" class="status">Cargando seguimiento de ánimo…</div>
<div id="content" hidden>
<div class="top"><h1>Seguimiento de ánimo</h1><select id="period"></select></div>
<div class="metrics">
<div class="metric"><span class="label">Bienestar general</span><strong class="value" id="general">—</strong></div>
<div class="metric"><span class="label">Meta</span><strong class="value">70%</strong></div>
<div class="metric"><span class="label">Diferencia vs. meta</span><strong class="value" id="gap">—</strong></div>
</div>
<div class="chart-card"><div class="chart-title">Evolución histórica</div><div class="chart" id="chart"></div></div>
<p class="note">Promedio de Energía, Motivación, Ánimo y Calma. El día en curso no se incluye.</p>
</div>
</section>
</main>
<script>
'use strict';
const META=70,statusEl=document.getElementById('status'),content=document.getElementById('content'),period=document.getElementById('period');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(rows){
 const W=900,H=220,p={l:38,r:18,t:12,b:30},iw=W-p.l-p.r,ih=H-p.t-p.b;
 const vals=rows.map(x=>Number.isFinite(x.general)?x.general:null);
 const pts=vals.map((v,i)=>v==null?null:{x:p.l+(rows.length===1?iw/2:i*iw/(rows.length-1)),y:p.t+(100-v)*ih/100,v});
 let svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
 [0,20,40,60,80,100].forEach(v=>{const y=p.t+(100-v)*ih/100;svg+='<line class="grid" x1="'+p.l+'" y1="'+y+'" x2="'+(W-p.r)+'" y2="'+y+'"/><text class="axis" x="2" y="'+(y+3)+'">'+v+'%</text>'});
 const gy=p.t+(100-META)*ih/100;svg+='<line class="goal" x1="'+p.l+'" y1="'+gy+'" x2="'+(W-p.r)+'" y2="'+gy+'"/>';
 const valid=pts.filter(Boolean);if(valid.length>1)svg+='<polyline class="line" points="'+valid.map(q=>q.x+','+q.y).join(' ')+'"/>';
 valid.forEach(q=>svg+='<circle class="dot" cx="'+q.x+'" cy="'+q.y+'" r="5"/>');
 rows.forEach((r,i)=>{const x=p.l+(rows.length===1?iw/2:i*iw/(rows.length-1));svg+='<text class="axis" text-anchor="middle" x="'+x+'" y="'+(H-7)+'">'+esc(r.mes.slice(0,3))+' '+r.anio+'</text>'});
 svg+='</svg>';document.getElementById('chart').innerHTML=svg;
}
function render(data,index){
 const row=data.items[index],v=Number(row.general),delta=v-META;
 document.getElementById('general').textContent=Number.isFinite(v)?v.toFixed(1)+'%':'—';
 document.getElementById('gap').textContent=Number.isFinite(delta)?(delta>0?'+':'')+delta.toFixed(1)+' pp':'—';
 draw(data.items);
}
fetch('data-seguimiento-bienestar.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{
 if(!Array.isArray(data.items)||!data.items.length)throw Error('Sin datos');
 data.items.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.mes+' '+r.anio;period.appendChild(o)});
 period.value=data.items.length-1;period.addEventListener('change',()=>render(data,Number(period.value)));
 render(data,data.items.length-1);statusEl.hidden=true;content.hidden=false;
}).catch(()=>statusEl.textContent='No se pudieron cargar los datos de ánimo.');
</script>
</body>
</html>
